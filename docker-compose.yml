# Shared network for cross-container communication
networks:
  flightiq-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:

services:
  # 1. Apache Zookeeper (Required for Kafka coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: flightiq-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - flightiq-net

  # 2. Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: flightiq-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - flightiq-net

  # 3. Kafka UI (Web dashboard to monitor topics and messages)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flightiq-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: flightiq-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - flightiq-net

  # 4. Apache Spark Master Node
  spark-master:
    image: apache/spark:3.5.0
    container_name: flightiq-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark/work-dir/data
    networks:
      - flightiq-net

  # 5. Apache Spark Worker Node
  spark-worker:
    image: apache/spark:3.5.0
    container_name: flightiq-spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./data:/opt/spark/work-dir/data
    networks:
      - flightiq-net

  # 6. Hadoop HDFS NameNode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: flightiq-namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=flightiq-cluster
    env_file:
      - ./hadoop.env
    networks:
      - flightiq-net

  # 7. Hadoop HDFS DataNode
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: flightiq-datanode
    depends_on:
      - namenode
    env_file:
      - ./hadoop.env
    networks:
      - flightiq-net

  # 8. PostgreSQL (Enables Power BI connection via Thrift/ODBC)
  postgres:
    image: postgres:13
    container_name: flightiq-postgres
    environment:
      POSTGRES_USER: flightiq
      POSTGRES_PASSWORD: flightiq
      POSTGRES_DB: flightiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flightiq-net

  # 9. pgAdmin (Manage UI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: flightiq-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flightiq.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - flightiq-net